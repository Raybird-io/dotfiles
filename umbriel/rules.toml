# ─── Window rules (same as niri/rules.kdl) ─────────────────
# Later rules win when two set the same thing.

# Small tools: float
[[window_rule]]
match.app_id = ["^org\\.gnome\\.Calculator$", "^gnome-calculator$", "^xdg-desktop-portal$"]
default_floating = true

[[window_rule]]
match.app_id = "^io\\.github\\.kolunmi\\.Bazaar$"
default_floating = true
default_floating_size_px = { width = 900, height = 900 }

# Settings-style apps: tile at 40%
[[window_rule]]
match.app_id = ["^pavucontrol$", "^nm-connection-editor$"]
default_floating = false
default_scrolling_extent = 0.4

# Picture-in-Picture and Zoom: float
[[window_rule]]
match.app_id = "firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^zoom"
default_floating = true

# Dux Files: float
[[window_rule]]
match.app_id = "^dev\\.duxlabs\\.files$"
default_floating = true
default_floating_size_px = { width = 1100, height = 750 }

# Terminal: float
[[window_rule]]
match.app_id = "^org\\.gnome\\.Ptyxis$"
default_floating = true
default_floating_size_px = { width = 1000, height = 650 }

# ─── Steam ─────────────────────────────────────────────────
# Pop-ups float...
[[window_rule]]
match.app_id = "^steam$"
default_floating = true

# ...but the main "Steam" window tiles
[[window_rule]]
match.app_id = "^steam$"
match.title = "^Steam$"
default_floating = false

# Notification toasts: bottom-right, don't steal focus
[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false

# Games: always on the ultrawide, with VRR
[[window_rule]]
match.app_id = "^steam_app_"
default_output = "DP-1"
vrr = "always"
background_render = true

[[window_rule]]
match.content_type = "game"
background_render = true

[[layer_rule]]
match.namespace = ["^dms:", "^quickshell$"]
blur = true
blur_popups = true
blur_ignore_alpha = 0.5
blur_optimized = false

# ─── Dux apps (Files, Calendar…): live blur behind them ────
[[window_rule]]
match.app_id = "^dev\\.duxlabs\\."
blur = true
blur_popups = true
blur_optimized = false