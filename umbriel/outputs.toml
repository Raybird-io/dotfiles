# ─── Outputs ───────────────────────────────────────────────

# Ultrawide: windows about a third wide, VRR while a game is fullscreen
[output.DP-1]
mode = "3440x1440@240"
position = [0, 0]
scale = 1.0
vrr = "fullscreen"
focus_at_startup = true
layout.scrolling.default_extent_fraction = 0.33

# Portrait: windows stack top to bottom, nearly full width.
# 0.45 tall leaves a "lip" of the next window showing.
[output.DP-2]
mode = "1920x1080@74.973"
position = [3440, 0]
scale = 1.0
transform = "270"
workspace_axis = "horizontal"
layout.scrolling.default_extent_fraction = 0.45

# ─── Small edge gaps on DP-2 ───────────────────────────────
# Umbriel sets edge gaps per workspace, so the first six
# workspaces on DP-2 each get the small gaps.
[[workspace]]
index = 1
output = "DP-2"
layout.struts = { left = 16, right = 16, top = 16, bottom = 16 }

[[workspace]]
index = 2
output = "DP-2"
layout.struts = { left = 16, right = 16, top = 16, bottom = 16 }

[[workspace]]
index = 3
output = "DP-2"
layout.struts = { left = 16, right = 16, top = 16, bottom = 16 }

[[workspace]]
index = 4
output = "DP-2"
layout.struts = { left = 16, right = 16, top = 16, bottom = 16 }

[[workspace]]
index = 5
output = "DP-2"
